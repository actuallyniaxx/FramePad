name: CI

# Builds FramePad on every push and pull request, runs the tests and uploads
# a ready-to-run build (zip of the deployed folder) as a workflow artifact.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # GPL "shared" build of the FFmpeg 8.1 branch: headers, MSVC import libraries and DLLs.
  FFMPEG_PACKAGE: ffmpeg-n8.1-latest-win64-gpl-shared-8.1

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Install FFmpeg
        run: |
          curl -sSfL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$FFMPEG_PACKAGE.zip"
          unzip -q ffmpeg.zip -d "$RUNNER_TEMP"
          root="$(cygpath -m "$RUNNER_TEMP")/$FFMPEG_PACKAGE"
          echo "FFMPEG_ROOT=$root" >> "$GITHUB_ENV"
          # The tests load the FFmpeg DLLs from PATH.
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -A x64 -DFFMPEG_ROOT="$FFMPEG_ROOT"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: |
          set +e
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee ctest.log
          status=${PIPESTATUS[0]}
          # On failure the test output also becomes an annotation, readable without opening the log.
          if [ "$status" != "0" ]; then
            exe=$(find build -name tst_media.exe | head -1); echo "running $exe" >> ctest.log
            ldd "$exe" >> ctest.log 2>&1
            "$exe" -v2 -o qtest.txt,txt >> ctest.log 2>&1; echo "tst_media exit code: $?" >> ctest.log
            cat qtest.txt >> ctest.log 2>&1
            output=$(tail -n 80 ctest.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test output::$output"
          fi
          exit $status

      - name: Check translations
        run: |
          # lupdate rescans the sources; any string without a Spanish translation is reported.
          cmake --build build --config Release --target update_translations
          missing=$(grep -c 'type="unfinished"' translations/FramePad_es.ts || true)
          if [ "$missing" != "0" ]; then
            echo "::warning file=translations/FramePad_es.ts::$missing untranslated string(s). Open the file in Qt Linguist to translate them."
          fi

      - name: Deploy runtime
        run: |
          mkdir -p deploy/licenses
          cp build/Release/FramePad.exe deploy/
          windeployqt --release --no-system-d3d-compiler deploy/FramePad.exe
          cp "$FFMPEG_ROOT"/bin/{avcodec,avformat,avutil,swscale,swresample}-*.dll deploy/
          cp "$FFMPEG_ROOT/LICENSE.txt" deploy/licenses/FFmpeg.txt
          cp LICENSE deploy/licenses/FramePad.txt

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: FramePad-${{ github.sha }}-win-x64
          path: deploy/
